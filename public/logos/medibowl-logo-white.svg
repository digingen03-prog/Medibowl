<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mbw-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="mbw-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="mbw-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="mbw-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="mbw-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E7C15B"/>
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM -->
  <g transform="translate(15, 10)">
    <circle cx="50" cy="50" r="46" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2.5" stroke-dasharray="190 20" stroke-linecap="round"/>
    
    <path d="M 12 50 C 12 26, 32 10, 56 12 C 78 14, 92 34, 90 56 C 88 74, 72 88, 52 88" 
          stroke="url(#mbw-purple-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <path d="M 88 50 C 88 74, 68 90, 44 88 C 22 86, 8 66, 10 44 C 12 26, 28 12, 48 12" 
          stroke="url(#mbw-cyan-grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <path d="M 22 68 C 16 54, 20 34, 38 22 C 54 10, 78 14, 86 32 C 92 46, 88 64, 74 76" 
          stroke="url(#mbw-green-grad)" stroke-width="2" stroke-linecap="round" fill="none"/>

    <ellipse cx="50" cy="50" rx="34" ry="34" fill="#032666"/>
    
    <ellipse cx="50" cy="50" rx="33" ry="14" stroke="url(#mbw-gold-grad)" stroke-width="2" fill="none" transform="rotate(-28 50 50)"/>
    
    <g transform="translate(50, 50)">
      <rect x="-6" y="-18" width="12" height="36" rx="3" fill="#FFFFFF"/>
      <rect x="-18" y="-6" width="36" height="12" rx="3" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="4.5" fill="url(#mbw-gold-grad)"/>
      <circle cx="0" cy="0" r="2" fill="#032666"/>
    </g>
    
    <circle cx="50" cy="4" r="3.5" fill="url(#mbw-gold-grad)"/>
    <circle cx="94" cy="42" r="3" fill="#67E8F9"/>
    <circle cx="8" cy="58" r="3" fill="#A78BFA"/>
    <circle cx="62" cy="94" r="3.5" fill="#6EE7B7"/>
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(135, 20)">
    <text x="0" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      MEDI<tspan fill="#60A5FA">BOWL</tspan>
    </text>

    <text x="2" y="62" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="#E7C15B">
      INTERNATIONAL <tspan fill="#CBD5E1" font-weight="500" letter-spacing="2.5">PVT. LTD.</tspan>
    </text>

    <line x1="2" y1="72" x2="440" y2="72" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2"/>
    <line x1="2" y1="72" x2="68" y2="72" stroke="url(#mbw-gold-grad)" stroke-width="2.5"/>

    <text x="2" y="88" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#FDE047">
      BETTER HEALTH <tspan fill="rgba(255, 255, 255, 0.4)">|</tspan> BRIGHTER TOMORROW
    </text>
  </g>
</svg>

