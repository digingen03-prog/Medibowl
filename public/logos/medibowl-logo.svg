<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mb-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043784"/>
      <stop offset="100%" stop-color="#032666"/>
    </linearGradient>
    <linearGradient id="mb-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="mb-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="mb-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mb-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" flood-color="#032666"/>
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Global Healthcare Sphere with Medical Cross & Orbiting Rings) -->
  <g transform="translate(15, 10)">
    <!-- Outer Healthcare Globe Ring (Royal Blue & Cyan) -->
    <circle cx="50" cy="50" r="46" stroke="url(#mb-blue-grad)" stroke-width="2.5" stroke-dasharray="190 20" stroke-linecap="round"/>
    
    <!-- Dynamic Orbiting Swoosh 1 (Purple - Innovation) -->
    <path d="M 12 50 C 12 26, 32 10, 56 12 C 78 14, 92 34, 90 56 C 88 74, 72 88, 52 88" 
          stroke="url(#mb-purple-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Dynamic Orbiting Swoosh 2 (Cyan - Healthcare Care) -->
    <path d="M 88 50 C 88 74, 68 90, 44 88 C 22 86, 8 66, 10 44 C 12 26, 28 12, 48 12" 
          stroke="url(#mb-cyan-grad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Dynamic Orbiting Swoosh 3 (Emerald Green - Vitality & Wellness) -->
    <path d="M 22 68 C 16 54, 20 34, 38 22 C 54 10, 78 14, 86 32 C 92 46, 88 64, 74 76" 
          stroke="url(#mb-green-grad)" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Central Healthcare Bowl / Globe Core -->
    <ellipse cx="50" cy="50" rx="34" ry="34" fill="#FFFFFF" filter="url(#subtle-shadow)"/>
    
    <!-- Gold Orbit Meridian -->
    <ellipse cx="50" cy="50" rx="33" ry="14" stroke="url(#mb-gold-grad)" stroke-width="2" fill="none" transform="rotate(-28 50 50)"/>
    
    <!-- Sacred Medical Cross with Beveled Royal Blue Finish -->
    <g transform="translate(50, 50)">
      <!-- Vertical bar -->
      <rect x="-6" y="-18" width="12" height="36" rx="3" fill="url(#mb-blue-grad)"/>
      <!-- Horizontal bar -->
      <rect x="-18" y="-6" width="36" height="12" rx="3" fill="url(#mb-blue-grad)"/>
      <!-- Golden Core Accent -->
      <circle cx="0" cy="0" r="4.5" fill="url(#mb-gold-grad)"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>
    
    <!-- Cardinal Satellite Nodes (representing Global Reach) -->
    <circle cx="50" cy="4" r="3.5" fill="url(#mb-gold-grad)"/>
    <circle cx="94" cy="42" r="3" fill="#22D3EE"/>
    <circle cx="8" cy="58" r="3" fill="#8B5CF6"/>
    <circle cx="62" cy="94" r="3.5" fill="#10B981"/>
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(135, 20)">
    <!-- Primary Wordmark: MEDIBOWL -->
    <text x="0" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="900" letter-spacing="1.5" fill="#032666">
      MEDI<tspan fill="#043784">BOWL</tspan>
    </text>

    <!-- Secondary Segment: INTERNATIONAL PRIVATE LIMITED -->
    <text x="2" y="62" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="4.5" fill="#034EA6">
      INTERNATIONAL <tspan fill="#5E6C84" font-weight="600" letter-spacing="2.5">PVT. LTD.</tspan>
    </text>

    <!-- Fine Separator Rule with Gold Accent -->
    <line x1="2" y1="72" x2="440" y2="72" stroke="#E2E8F0" stroke-width="1.2"/>
    <line x1="2" y1="72" x2="68" y2="72" stroke="url(#mb-gold-grad)" stroke-width="2.5"/>

    <!-- Official Brand Tagline -->
    <text x="2" y="88" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#D4AF37">
      BETTER HEALTH <tspan fill="#94A3B8">|</tspan> BRIGHTER TOMORROW
    </text>
  </g>
</svg>

